name: Build Reality Client
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reality-client/reality-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: reality-client-jar
          path: reality-client/reality-client/build/libs/reality-client-*.jar
